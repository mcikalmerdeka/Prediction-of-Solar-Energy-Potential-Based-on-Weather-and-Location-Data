[theme]
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
linkUnderline = false

font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'Fraunces':https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontSizes = ["38px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 500, 500]
chartCategoricalColors = ["#D97706", "#0F766E", "#2563EB", "#BE123C", "#65A30D", "#7C3AED", "#0891B2"]

[theme.light]
primaryColor = "#B45309"
backgroundColor = "#FFFBF5"
secondaryBackgroundColor = "#FDF3E3"
textColor = "#1C1917"
linkColor = "#B45309"
borderColor = "#E7DDCB"
dataframeBorderColor = "#E7DDCB"
dataframeHeaderBackgroundColor = "#FDF3E3"
greenColor = "#15803D"
redColor = "#B91C1C"
orangeColor = "#B45309"
blueColor = "#1D4ED8"
violetColor = "#6D28D9"
grayColor = "#57534E"

[theme.dark]
primaryColor = "#F59E0B"
backgroundColor = "#171310"
secondaryBackgroundColor = "#241D16"
textColor = "#FBF5EA"
linkColor = "#FBBF24"
borderColor = "#3A2F23"
dataframeBorderColor = "#3A2F23"
dataframeHeaderBackgroundColor = "#241D16"
greenColor = "#4ADE80"
redColor = "#F87171"
orangeColor = "#FBBF24"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#A8A29E"
